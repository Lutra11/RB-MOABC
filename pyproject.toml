[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-aware-reservoir-scheduling"
version = "0.1.0"
description = "Dynamic risk-budget allocation and rolling multi-objective scheduling for cascade reservoirs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "xarray>=2024.1",
  "netCDF4>=1.6",
]

[tool.setuptools.packages.find]
include = ["MOABC*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

